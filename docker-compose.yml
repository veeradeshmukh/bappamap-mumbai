services:
  db:
    image: postgis/postgis:15-3.3
    container_name: bappamap-postgis
    environment:
      POSTGRES_DB: bappamap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bappapassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bappamap"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bappamap-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:bappapassword@db:5432/bappamap
      ADMIN_PASSWORD: bappa-admin-secret-2027
      SECRET_KEY: bappamap_default_session_secret_dev_key_2027
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      RATE_LIMIT_SALT: bappamap_dev_salt_local
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
