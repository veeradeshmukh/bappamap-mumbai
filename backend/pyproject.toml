[project]
name = "bappamap-backend"
version = "1.0.0"
description = "FastAPI + PostGIS backend for BappaMap Mumbai"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.16.0",
    "alembic>=1.14.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.19",
    "sse-starlette>=2.1.3",
    "boto3>=1.35.0",
    "slowapi>=0.1.9",
    "psycopg2-binary>=2.9.10",
    "greenlet>=3.1.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7.20240819",
    "types-boto3>=1.35.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
